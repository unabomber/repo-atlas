<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Repo Atlas — see how any GitHub repo is built</title>
<style>
:root{--bg:#0a0e16;--panel:#111827;--card:#161f31;--card2:#1b2539;--line:#27324b;--text:#e7ecf6;--mute:#8f9bb8;--acc:#6ea8ff;--out:#6ea8ff;--in:#ffb454;--warn:#ff6b6b;--ok:#4ade80;--edge:#52607f;--shadow:0 8px 30px rgba(0,0,0,.35);
 --client:#38bdf8;--api:#a78bfa;--cli:#c084fc;--worker:#fb923c;--core:#34d399;--data:#fbbf24;--shared:#94a3b8;--infra:#64748b;--ext:#f472b6}
:root[data-theme=light]{--bg:#f4f6fb;--panel:#fff;--card:#fff;--card2:#f1f4fa;--line:#d9e0ee;--text:#18223a;--mute:#5d6b8c;--acc:#2f6fed;--out:#2f6fed;--in:#d97706;--warn:#dc2626;--ok:#16a34a;--edge:#9aa7c4;--shadow:0 8px 24px rgba(30,45,90,.12)}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f4f6fb;--panel:#fff;--card:#fff;--card2:#f1f4fa;--line:#d9e0ee;--text:#18223a;--mute:#5d6b8c;--acc:#2f6fed;--out:#2f6fed;--in:#d97706;--warn:#dc2626;--ok:#16a34a;--edge:#9aa7c4;--shadow:0 8px 24px rgba(30,45,90,.12)}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;display:flex;flex-direction:column}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
header.top{display:flex;gap:14px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:-.02em;font-size:17px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,var(--client),var(--api),var(--ext),var(--worker),var(--core),var(--client));display:inline-block}
form.go{display:flex;gap:8px;flex:1;min-width:300px;max-width:760px}
form.go input[type=text]{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
form.go input[type=text]:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.sm{padding:4px 9px;border-radius:8px;font-size:12.5px}
select.btn{padding:7px 8px}
.spacer{flex:1}
#progress{height:3px;background:transparent}#progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--client),var(--api),var(--ext));transition:width .2s}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.landing{overflow:auto;padding:46px 22px 60px;max-width:1100px;margin:0 auto;width:100%}
.landing h1{font-size:38px;letter-spacing:-.03em;line-height:1.1;margin:0 0 12px}
.landing p.lead{font-size:17px;color:var(--mute);max-width:720px;margin:0 0 22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--acc)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:34px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.feat b{display:block;margin-bottom:4px}.feat span{color:var(--mute);font-size:13px}
#status{padding:30px;text-align:center;color:var(--mute)}
#status .err{color:var(--warn);max-width:640px;margin:0 auto}
.repohead{display:flex;gap:14px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.repohead h2{margin:0;font-size:17px}.repohead .meta{color:var(--mute);font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap}
nav.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--panel)}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--mute);white-space:nowrap;font-weight:500}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
.panel{flex:1;min-height:0;overflow:auto;padding:20px}
.panel.flush{padding:0;display:flex;overflow:hidden}
.wrap{max-width:1180px;margin:0 auto}
h3{margin:26px 0 10px;font-size:15px;letter-spacing:.01em}h3:first-child{margin-top:0}
h3 small{color:var(--mute);font-weight:400;margin-left:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{font-size:24px;display:block;letter-spacing:-.02em}.stat span{color:var(--mute);font-size:12.5px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:900px){.two{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);background:var(--card2);color:var(--text);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--card2);border:1px solid var(--line);margin:2px 4px 2px 0;color:var(--mute)}
.tag.fw{color:var(--text)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--card2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--mute)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:50%}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mute);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:-20px;background:var(--bg)}
td{padding:6px 8px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:top}
tr:hover td{background:color-mix(in srgb,var(--card2) 60%,transparent)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.method{font-family:ui-monospace,monospace;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--card2);display:inline-block;min-width:44px;text-align:center}
.m-GET{color:#4ade80}.m-POST{color:#60a5fa}.m-PUT,.m-PATCH{color:#fbbf24}.m-DELETE{color:#f87171}.m-PAGE{color:#c084fc}
.callout{border-left:3px solid var(--acc);background:var(--card);padding:10px 14px;border-radius:0 10px 10px 0;margin:8px 0;font-size:13.5px}
.callout.warn{border-color:var(--warn)}.callout.ok{border-color:var(--ok)}
ul.clean{list-style:none;margin:0;padding:0}ul.clean li{padding:5px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent)}
.link{color:var(--acc);cursor:pointer}.link:hover{text-decoration:underline}
/* architecture */
.archwrap{flex:1;display:flex;min-width:0;min-height:0;position:relative}
.canvas{flex:1;position:relative;min-width:0;background:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--line) 70%,transparent) 1px,transparent 0) 0 0/22px 22px}
.canvas svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.canvas svg.pan{cursor:grabbing}
.toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none;z-index:3}
.toolbar>*{pointer-events:auto}
.toolbar .grp{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.toolbar .grp button{background:none;border:0;padding:6px 11px;cursor:pointer;font-size:13px;color:var(--mute)}
.toolbar .grp button.on{background:var(--acc);color:#fff}
.toolbar label{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13px;display:flex;gap:6px;align-items:center;box-shadow:var(--shadow);cursor:pointer}
.toolbar input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;box-shadow:var(--shadow);width:170px;outline:none}
.keybox{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--mute);box-shadow:var(--shadow);max-width:440px;z-index:3}
.keybox .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.keybox i.ln{display:inline-block;width:22px;height:0;border-top:2px solid var(--edge);vertical-align:middle;margin-right:4px}
.drawer{width:370px;max-width:46vw;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px;flex-shrink:0}
.drawer h4{margin:0 0 4px;font-size:16px;word-break:break-all}.drawer h5{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.drawer .empty{color:var(--mute);text-align:center;margin-top:80px;padding:0 20px}
.drawer li{font-size:13px}.drawer .w{float:right;color:var(--mute);font-size:12px}
.ex{font-size:11.5px;color:var(--mute);padding-left:12px;word-break:break-all}
/* svg */
.node{cursor:pointer}.node .bx{fill:var(--card);stroke-width:1.5;transition:filter .15s}
.node:hover .bx{filter:brightness(1.25)}
.node text{fill:var(--text);pointer-events:none}.node .t1{font-size:12.5px;font-weight:600}.node .t2{font-size:10.5px;fill:var(--mute)}
.node.dim{opacity:.18}.node.tdn,.node.tup{opacity:.7}
.node.sel .bx{stroke-width:3;filter:drop-shadow(0 0 8px var(--acc))}
.edge .line{fill:none;stroke:var(--edge);opacity:.5}.edge .hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.edge.k-extends .line{stroke:var(--acc);opacity:.9}.edge.k-implements .line{stroke:var(--acc);stroke-dasharray:6 4;opacity:.9}.edge.k-uses .line{opacity:.3}.edge.k-call .line{stroke:var(--acc);opacity:.6}.edge.k-self .line{opacity:.3;stroke-dasharray:2 3}
.grp2{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.grp2 button{background:none;border:0;padding:5px 12px;cursor:pointer;color:var(--mute)}.grp2 button.on{background:var(--acc);color:#fff}.grp2 button:disabled{opacity:.4;cursor:default}
.edge.back .line{stroke:var(--warn);stroke-dasharray:5 4;opacity:.7}.edge.inf .line{stroke-dasharray:3 4}
.edge.out .line{stroke:var(--out);opacity:1}.edge.in .line{stroke:var(--in);opacity:1}.edge.tr .line{opacity:.8}
.edge.dim .line{opacity:.05}.edge.hov .line{opacity:1;stroke:var(--acc)}
.colhdr{font-size:11px;fill:var(--mute);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.lane{fill:color-mix(in srgb,var(--card2) 50%,transparent);stroke:var(--line);stroke-dasharray:2 4}
/* flows */
.flow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.steps{display:flex;flex-direction:column;gap:0;margin-top:8px}
.step{display:flex;gap:12px;position:relative;padding-bottom:12px}
.step .dot{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#0a0e16;z-index:1}
.step:not(:last-child)::before{content:"";position:absolute;left:12px;top:26px;bottom:0;border-left:2px dashed var(--line)}
.step .body{flex:1;min-width:0}.step .via{font-size:11.5px;color:var(--mute)}
.step b{cursor:pointer}.step b:hover{color:var(--acc)}
/* files */
.filesplit{display:flex;flex:1;min-height:0}
.tree{width:46%;min-width:320px;overflow:auto;border-right:1px solid var(--line);padding:8px 8px 40px;font-size:13px}
.trow{display:flex;align-items:center;gap:6px;padding:2px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
.trow:hover{background:var(--card2)}.trow.on{background:color-mix(in srgb,var(--acc) 25%,transparent)}
.trow .cnt{margin-left:auto;color:var(--mute);font-size:11.5px}.dotc{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.fdetail{flex:1;overflow:auto;padding:18px}
.fsearch{position:sticky;top:0;background:var(--bg);padding:6px 4px 8px;z-index:2}.fsearch input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
textarea.out{width:100%;height:300px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;font:12px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:460px}dialog::backdrop{background:rgba(0,0,0,.5)}
dialog input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;margin:8px 0}
.filter{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:none;width:260px;margin-bottom:10px}
.hint{color:var(--mute);font-size:12.5px}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><i></i>Repo Atlas</div>
  <form class="go" id="goform"><input type="text" id="repoInput" placeholder="owner/repo or https://github.com/owner/repo  (add @branch to pick a branch)" autocomplete="off" spellcheck="false"><select class="btn" id="depth" title="How many source files to read for import analysis"><option value="250">Quick</option><option value="600" selected>Standard</option><option value="1500">Deep</option></select><button class="btn pri" type="submit">Analyze</button></form>
  <button class="btn" id="tokenBtn" title="GitHub token (private repos / rate limits)">⚙ Token</button>
  <button class="btn" id="loadJson" title="Load a previously exported analysis JSON">Load JSON</button>
  <button class="btn" id="themeBtn" title="Toggle theme">◐</button>
</header>
<div id="progress"><i></i></div>
<main id="main"></main>
<dialog id="tokenDlg"><form method="dialog"><b>GitHub token (optional)</b><p class="hint">Needed for private repos, and raises the API limit from 60 to 5,000 requests/hour. Stored only in this browser (localStorage) and sent only to api.github.com.</p><input id="tokenInput" type="password" placeholder="ghp_… or github_pat_…" autocomplete="off"><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" value="clear">Clear</button><button class="btn pri" value="save">Save</button></div></form></dialog>
<input type="file" id="fileIn" accept=".json" hidden>
<script>
//#ANALYZER-START
/* ============================================================
   Repo Atlas — analyzer. Pure JS, runs in browser or node 18+.
   analyzeRepo(input, opts, onProgress) -> architecture model
   ============================================================ */
const LANG = {js:'JavaScript',jsx:'JavaScript',mjs:'JavaScript',cjs:'JavaScript',ts:'TypeScript',tsx:'TypeScript',mts:'TypeScript',cts:'TypeScript',
  vue:'Vue',svelte:'Svelte',astro:'Astro',py:'Python',go:'Go',rs:'Rust',java:'Java',kt:'Kotlin',kts:'Kotlin',scala:'Scala',rb:'Ruby',php:'PHP',
  cs:'C#',vb:'Visual Basic',fs:'F#',swift:'Swift',dart:'Dart',ex:'Elixir',exs:'Elixir',erl:'Erlang',clj:'Clojure',lua:'Lua',c:'C',h:'C',cc:'C++',cpp:'C++',cxx:'C++',hpp:'C++',
  m:'Objective-C',mm:'Objective-C',sql:'SQL',proto:'Protobuf',graphql:'GraphQL',gql:'GraphQL',prisma:'Prisma',tf:'Terraform',html:'HTML',htm:'HTML',
  css:'CSS',scss:'CSS',sass:'CSS',less:'CSS'};
const SOURCE_EXT = new Set(Object.keys(LANG));
const SCAN_EXT = new Set('js jsx mjs cjs ts tsx mts cts vue svelte astro py go rs java kt kts scala rb php cs vb dart c h cc cpp cxx hpp sql prisma'.split(' '));
const ASSET_EXT = new Set('png jpg jpeg gif svg ico webp avif woff woff2 ttf eot otf mp4 mp3 wav pdf zip gz tar tgz jar class exe dll so dylib bin wasm lock map snap psd ai sketch bmp'.split(' '));
const DOC_EXT = new Set(['md','rst','txt','adoc','mdx']);
const CONF_EXT = new Set(['json','yml','yaml','toml','ini','cfg','env','xml','properties','conf','gradle','csproj']);
const IGN_RE = /(^|\/)(node_modules|vendor|dist|build|target|\.git|\.next|\.nuxt|\.svelte-kit|\.output|__pycache__|\.venv|venv|coverage|third_party|thirdparty|bower_components|\.gradle|Pods|\.idea|\.vscode|generated|__generated__|migrations?|site-packages|\.turbo|\.cache|storybook-static)(\/|$)/i;
const TEST_RE = /(^|\/)(tests?|__tests__|spec|specs|e2e|cypress|playwright|__mocks__|__snapshots__|fixtures|testdata|testing|integration-tests?)(\/|$)|\.(test|spec|stories)\.[a-z]+$|_test\.(go|py|rb)$|(^|\/)test_[^\/]*\.py$|(^|\/)conftest\.py$|Tests?\.(java|kt|cs)$/i;
const AUX_NAME = /^(docs?|documentation|examples?|samples?|demos?|benchmarks?|scripts?|tools|playground|website-docs|\.github|\.circleci|\.husky)$/i;
const AUX_BLOCK = /^(src|main|java|kotlin|scala|lib|app|org|com|net|io|packages)$/i;
function isAux(path){ const segs=path.split('/').slice(0,-1); for(let i=0;i<Math.min(segs.length,3);i++){ if(AUX_NAME.test(segs[i]) && !segs.slice(0,i).some(x=>AUX_BLOCK.test(x)&&x.toLowerCase()!=='packages')) return true; } return false; }
const CFGNAME_RE = /(^|\/)([^\/]*\.config|setup|babel\.config|gulpfile|Gruntfile|jest\.setup|vitest\.setup|setupTests|tailwind\.config|postcss\.config|karma\.conf|webpack\.[\w.]*|rollup\.[\w.]*|\.eslintrc|\.prettierrc|noxfile|fabfile|tasks)\.(js|cjs|mjs|ts|py)$/;
const MANIFESTS = new Set(['package.json','pyproject.toml','setup.py','go.mod','Cargo.toml','pom.xml','build.gradle','build.gradle.kts','Gemfile','composer.json','pubspec.yaml','mix.exs','requirements.txt','Pipfile']);
const COMPONENT_MANIFESTS = new Set(['package.json','pyproject.toml','go.mod','Cargo.toml','pom.xml','build.gradle','build.gradle.kts','composer.json','pubspec.yaml','mix.exs']);

const base = p => p.split('/').pop();
const dirOf = p => { const i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); };
const extOf = p => { const b = base(p); const i = b.lastIndexOf('.'); return i > 0 ? b.slice(i + 1).toLowerCase() : ''; };
function normPath(p){ const out=[]; for(const s of p.split('/')){ if(s===''||s==='.')continue; if(s==='..')out.pop(); else out.push(s);} return out.join('/'); }

function classify(path){
  const ext = extOf(path), b = base(path);
  if (IGN_RE.test(path) || ASSET_EXT.has(ext) || /\.min\.(js|css)$/.test(b) || b.endsWith('.d.ts')) return 'ignored';
  if (TEST_RE.test(path)) return 'test';
  if (isAux(path)) return 'aux';
  if (CFGNAME_RE.test(path)) return 'config';
  if (SOURCE_EXT.has(ext)) return 'source';
  if (DOC_EXT.has(ext)) return 'doc';
  if (CONF_EXT.has(ext) || /^(Dockerfile|Makefile|Procfile|Jenkinsfile)/.test(b)) return 'config';
  return 'other';
}

 ['org\\.springframework.*|spring-boot.*|spring-.*','Spring','framework'],['io\\.quarkus.*|quarkus-.*','Quarkus','framework'],['io\\.micronaut.*','Micronaut','framework'],
 ['github\\.com/gin-gonic/gin','Gin','framework'],['github\\.com/labstack/echo.*','Echo','framework'],['github\\.com/gofiber/fiber.*','Fiber','framework'],['github\\.com/go-chi/chi.*','chi','framework'],['github\\.com/gorilla/mux','gorilla/mux','framework'],

function techFor(name){

/* ---------------- tiny YAML ---------------- */
function parseYaml(text){
  const lines = text.replace(/\t/g,'  ').split('\n').map(l=>l.replace(/(^|\s)#.*$/,'').replace(/\s+$/,'')).filter(l=>l.trim()!==''&&l.trim()!=='---'&&!l.startsWith('%'));
  let i = 0;
  const ind = l => l.match(/^ */)[0].length;
  const splitTop = s => { const out=[]; let d=0,cur='',q=null; for(const ch of s){ if(q){cur+=ch; if(ch===q)q=null; continue;} if(ch==='"'||ch==="'"){q=ch;cur+=ch;continue;} if(ch==='['||ch==='{')d++; if(ch===']'||ch==='}')d--; if(ch===','&&d===0){out.push(cur);cur='';} else cur+=ch;} if(cur.trim())out.push(cur); return out; };
  function scalar(s){
    s = s.trim();
    let m = s.match(/^(['"])([\s\S]*)\1$/); if (m) return m[2];
    if (s==='true') return true; if (s==='false') return false; if (s==='null'||s==='~') return null;
    if (/^-?\d+(\.\d+)?$/.test(s)) return +s;
    if (s[0]==='['&&s.endsWith(']')) return splitTop(s.slice(1,-1)).map(scalar);
    if (s[0]==='{'&&s.endsWith('}')) { const o={}; for(const kv of splitTop(s.slice(1,-1))){ const j=kv.indexOf(':'); if(j>0)o[kv.slice(0,j).trim()]=scalar(kv.slice(j+1)); } return o; }
    return s;
  }
  const isItem = l => /^-(\s|$)/.test(l.trim());
  function block(){
    if (i>=lines.length) return null;
    const n = ind(lines[i]);
    return isItem(lines[i]) ? list(n) : map(n);
  }
  function list(n){
    const arr = [];
    while (i<lines.length && ind(lines[i])===n && isItem(lines[i])) {
      const c = lines[i].trim().slice(1).trim();
      if (c==='') { i++; arr.push(i<lines.length&&ind(lines[i])>n ? block() : null); }
      else if (/^("[^"]*"|'[^']*'|[\w.\-\/$]+):(\s|$)/.test(c)) { lines[i] = ' '.repeat(n+2)+c; arr.push(map(n+2)); }
      else { i++; arr.push(scalar(c)); }
    }
    return arr;
  }
  function map(n){
    const o = {};
    while (i<lines.length && ind(lines[i])===n && !isItem(lines[i])) {
      const m = lines[i].trim().match(/^("[^"]*"|'[^']*'|[^:]+?):(?:\s+(.*))?$/);
      if (!m) { i++; continue; }
      const key = m[1].replace(/^["']|["']$/g,''); const rest = m[2]; i++;
      if (rest===undefined||rest==='') {
        if (i<lines.length && (ind(lines[i])>n || (ind(lines[i])===n && isItem(lines[i])))) o[key] = block(); else o[key] = null;
      } else if (/^[|>][+-]?$/.test(rest)) {
        const buf=[]; while(i<lines.length && ind(lines[i])>n) buf.push(lines[i++].trim()); o[key]=buf.join('\n');
      } else o[key] = scalar(rest);
    }
    return o;
  }
  try { return block() || {}; } catch(e){ return {}; }
}

function parseManifest(path, text){

      out.extra = {scripts:j.scripts||{}, main:j.main, bin:j.bin, workspaces:Array.isArray(j.workspaces)?j.workspaces:(j.workspaces&&j.workspaces.packages)||null, version:j.version, description:j.description, private:j.private};

    } else if (b==='pyproject.toml') {
      out.eco='pip'; out.name=(text.match(/^\s*name\s*=\s*["']([^"']+)["']/m)||[])[1]||null;
      const names=new Set();
      for (const m of text.matchAll(/(?:^|\n)\s*(?:dependencies|requires)\s*=\s*\[([\s\S]*?)\]/g)) for (const s of m[1].matchAll(/["']([A-Za-z0-9_.\-]+)/g)) names.add(s[1]);
      const poetry = text.match(/\[tool\.poetry\.dependencies\]([\s\S]*?)(?=\n\[|$)/); if (poetry) for (const m of poetry[1].matchAll(/^\s*([A-Za-z0-9_.\-]+)\s*=/gm)) if (m[1]!=='python') names.add(m[1]);
      out.deps=[...names];

    } else if (b==='Pipfile') {

    } else if (b==='go.mod') {
      out.eco='go'; out.name=(text.match(/^module\s+(\S+)/m)||[])[1]||null;
      for (const m of text.matchAll(/require\s*\(([\s\S]*?)\)/g)) for (const l of m[1].split('\n')) { const t=l.trim().split(/\s+/)[0]; if(t&&!t.startsWith('//')) out.deps.push(t); }
      for (const m of text.matchAll(/^require\s+(\S+)\s+v/gm)) out.deps.push(m[1]);
    } else if (b==='Cargo.toml') {
      out.eco='cargo'; out.name=(text.match(/\[package\][\s\S]*?name\s*=\s*"([^"]+)"/)||[])[1]||null;
      for (const sec of text.matchAll(/\[(?:[\w-]+\.)?dependencies\]([\s\S]*?)(?=\n\[|$)/g)) for (const m of sec[1].matchAll(/^\s*([A-Za-z0-9_\-]+)\s*=/gm)) out.deps.push(m[1]);

    } else if (b==='Gemfile') {

    } else if (b==='pom.xml') {

      for (const m of text.matchAll(/<dependency>([\s\S]*?)<\/dependency>/g)) { const g=(m[1].match(/<groupId>([^<]+)/)||[])[1], a=(m[1].match(/<artifactId>([^<]+)/)||[])[1]; if(a) out.deps.push(a); if(g) out.deps.push(g); }
    } else if (/^build\.gradle/.test(b)) {
      out.eco='gradle'; for (const m of text.matchAll(/['"]([\w.\-]+):([\w.\-]+)(?::[^'"]*)?['"]/g)) { out.deps.push(m[2]); out.deps.push(m[1]); }
    } else if (b==='composer.json') {
      const j=JSON.parse(text); out.eco='composer'; out.name=j.name||null; out.deps=Object.keys(j.require||{}); out.devDeps=Object.keys(j['require-dev']||{});
    } else if (b==='pubspec.yaml') {
      const y=parseYaml(text); out.eco='pub'; out.name=y.name||null; out.deps=Object.keys(y.dependencies||{});

      out.eco='hex'; out.deps=[...text.matchAll(/\{:(\w+),/g)].map(m=>m[1]);

      out.eco='nuget'; out.deps=[...text.matchAll(/PackageReference\s+Include="([^"]+)"/g)].map(m=>m[1]);
    }
  } catch(e){}
  return out;
}

    const seg = text.slice(c.pos, i+1<out.length ? out[i+1].pos : text.length);
    c.line = text.slice(0,c.pos).split('\n').length + (text[c.pos]==='\n'?1:0);
    c.idents = new Set(seg.match(/\b[A-Z][A-Za-z0-9_]{2,}\b/g)||[]);
    let rx = null;
    if (['JavaScript','TypeScript','Vue','Svelte','Astro'].includes(L)) rx = /^[ \t]+(?:(?:public|private|protected|static|async|override|readonly|abstract|get|set)\s+)*([A-Za-z_$][\w$]*)\s*(?:<[^>(]*>)?\s*\([^)]*\)\s*(?::\s*[^{;=]+)?\s*[{;]/gm;

    else if (L==='Kotlin') rx = /\bfun\s+(?:<[^>]*>\s*)?(?:[\w.]+\.)?(\w+)\s*\(/g;
    else if (L==='Scala') rx = /\bdef\s+(\w+)/g;
    else if (L==='Visual Basic') rx = /^[ \t]*(?!End\b)(?:\w+[ \t]+)*?(?:Sub|Function)[ \t]+(\w+)/gim;

    const ms = [];
    if (rx) for (const m of seg.matchAll(rx)) if (!NOT_METHOD.has(m[1]) && !ms.some(x=>x.name===m[1]) && ms.length<60) ms.push({name:m[1], idx:m.index + (m[0].match(/^\s*/)||[''])[0].length});
    ms.sort((a,b)=>a.idx-b.idx);
    const nlBefore = i => { let n=0; for (let p=seg.indexOf('\n'); p>=0 && p<i; p=seg.indexOf('\n',p+1)) n++; return n; };
    c.methods = []; c.mcalls = []; c.mlines = [];
    ms.forEach((m,i)=>{
      const body = seg.slice(m.idx, i+1<ms.length ? ms[i+1].idx : seg.length);
      const calls = callsOf(body, m.name, L);
      c.methods.push(m.name); c.mcalls.push(calls); c.mlines.push(c.line + nlBefore(m.idx));
    });
    c.types = typeMap(seg, L);

}

/* ---------------- component discovery ---------------- */
const CONTAINERS = new Set(['apps','packages','services','cmd','internal','pkg','crates','libs','modules','plugins','src','lib','app','projects','microservices','components-lib','workspaces']);
function buildComponents(srcFiles, manifestDirs){
  const total = srcFiles.length;
  const TARGET = 16;
  const mset = new Set(manifestDirs);
  const hasManifestBelow = path => manifestDirs.some(d => d !== path && (path===''||d.startsWith(path+'/')));
  function children(node){
    const depth = node.path ? node.path.split('/').length : 0;
    const groups = new Map(); const direct = [];
    for (const f of node.files) {
      const parts = f.path.split('/');
      if (parts.length-1 === depth) direct.push(f); else { const k=parts[depth]; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(f); }
    }
    return {groups, direct, depth};
  }
  function collapse(node){
    for(;;){
      if (node.path && mset.has(node.path) && node.files.length<14) return node;
      const {groups, direct} = children(node);
      if (direct.length===0 && groups.size===1) { const [k,fs]=[...groups][0]; node={path:(node.path?node.path+'/':'')+k, files:fs}; } else return node;
    }
  }
  function expand(node){
    const {groups, direct} = children(node);
    const out = []; let other = direct.slice();
    for (const [k, fs] of groups) {
      const p = (node.path?node.path+'/':'')+k;
      if (groups.size > 5 && fs.length < 3 && !mset.has(p) && !hasManifestBelow(p)) other = other.concat(fs);
      else out.push(collapse({path:p, files:fs}));
    }
    if (other.length) out.push({path:node.path, files:other, isRest:true});
    return out;
  }
  const canExpand = n => { if (n.isRest) return false; if (n.path && mset.has(n.path) && !hasManifestBelow(n.path) && n.files.length<14) return false; const {groups,direct}=children(n); if (groups.size+(direct.length?1:0)<2) return false; return (n.path?n.path.split('/').length:0) < 14; };
  const forced = n => canExpand(n) && (n.path===''||CONTAINERS.has(base(n.path))||hasManifestBelow(n.path));
  let comps = [collapse({path:'',files:srcFiles})];
  for (let guard=0; guard<500; guard++) {
    let pick = comps.find(forced);
    if (!pick && comps.length < TARGET) {
      pick = comps.filter(n=>canExpand(n) && n.files.length >= Math.max(6,total*0.12)).sort((a,b)=>b.files.length-a.files.length)[0];
    }
    if (!pick) break;
    const kids = expand(pick);
    if (kids.length<2 && !kids[0]?.isRest && kids[0] && kids[0].path===pick.path) break;
    comps = comps.filter(c=>c!==pick).concat(kids);
  }
  // merge extra small comps beyond cap
  const CAP = 60;
  if (comps.length > CAP) {
    comps.sort((a,b)=>b.files.length-a.files.length);
    const keep = comps.slice(0,CAP-1), rest = comps.slice(CAP-1);
    keep.push({path:'', files:rest.flatMap(c=>c.files), isRest:true, isMisc:true});
    comps = keep;
  }
  return comps;
}

const ROLE_TOKENS = {
 client:'web client frontend front ui components component pages views view www static public templates template mobile ios android desktop widgets screens layouts styles css site website landing dashboard admin renderer webapp'.split(' '),
 api:'api apis routes route router routers controllers controller handlers handler endpoints endpoint server http rest graphql grpc rpc gateway middleware resolvers bff backend'.split(' '),
 cli:'cli cmd bin commands command console'.split(' '),
 worker:'worker workers jobs job tasks task queue queues cron consumers consumer scheduler schedulers daemon'.split(' '),
 core:'core services service domain usecases engine logic business features feature'.split(' '),
 data:'models model db database stores repository repositories repo schema schemas orm entities entity dao prisma persistence storage sql data'.split(' '),
 shared:'utils util utilities common shared helpers helper types typings constants config configs support commons base sdk'.split(' '),
 infra:'infra infrastructure deploy deployment terraform k8s kubernetes docker helm ansible ci tooling'.split(' ')
};
const ROLE_ORDER = ['client','api','cli','worker','core','data','shared','infra'];
const ROLE_COL = {client:0,api:1,cli:1,worker:1,core:2,data:3,shared:3,infra:3};
const ROLE_LABEL = {client:'Frontend / UI',api:'API / transport',cli:'CLI / entry',worker:'Worker / jobs',core:'Core logic',data:'Data layer',shared:'Shared / utils',infra:'Infra / tooling'};
function guessRole(comp, tags, langMix){
  const segs = comp.path.toLowerCase().split('/').filter(Boolean).slice(-3);
  const scores = {}; 
  segs.forEach((seg,i)=>{ const w = i===segs.length-1?2:1; for (const tok of seg.split(/[^a-z0-9]+/)) if (tok) for (const r of ROLE_ORDER) if (ROLE_TOKENS[r].includes(tok)) scores[r]=(scores[r]||0)+w; });
  let best=null,bs=0; for (const r of ROLE_ORDER) if ((scores[r]||0)>bs){bs=scores[r];best=r;}
  if (best) return {role:best, guessed:false};
  const labels = new Set(tags.map(t=>t.label));
  const uiFrameworks = ['React','Vue','Svelte','Angular','Solid','Preact','Next.js','Nuxt','Astro','SvelteKit','Remix','Gatsby','React Native'];
  const tot = Object.values(langMix).reduce((a,b)=>a+b,0)||1;
  const frac = ks => ks.reduce((a,k)=>a+(langMix[k]||0),0)/tot;
  if (frac(['HTML','CSS','Vue','Svelte','Astro'])>0.6 || uiFrameworks.some(u=>labels.has(u))) return {role:'client', guessed:true};
  if (frac(['SQL','Prisma'])>0.6) return {role:'data', guessed:true};
  if (frac(['Terraform'])>0.6) return {role:'infra', guessed:true};
  if (frac(['Protobuf','GraphQL'])>0.6) return {role:'api', guessed:true};
  return {role:'core', guessed:true};
}

/* ---------------- fetch helpers ---------------- */
function parseRepoInput(s){
  s = s.trim().replace(/^https?:\/\/(www\.)?github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,'');
  let ref = null;
  const at = s.match(/^([^@]+)@(.+)$/); if (at) { s = at[1]; ref = at[2]; }
  const tree = s.match(/^([^\/]+)\/([^\/]+)\/tree\/(.+)$/); if (tree) return {owner:tree[1], repo:tree[2], ref:tree[3]};
  const m = s.match(/^([\w.\-]+)\/([\w.\-]+)/); if (!m) throw new Error('Enter a repo like owner/name or a github.com URL');
  return {owner:m[1], repo:m[2], ref};
}

async function analyzeRepo(input, opts = {}, onProgress = ()=>{}){

  const meta = await ghJson(`/repos/${owner}/${repo}`,'looking up the repo — the token cannot see it');

  onProgress({phase:`Reading file tree (${branch})…`, pct:6});
  const tree = await ghJson(`/repos/${owner}/${repo}/git/trees/${encodeURI(branch)}?recursive=1`,'listing files — repo is visible but Contents: Read-only is missing, or the branch name is wrong');

  const dockerFiles = files.filter(f=>/(^|\/)Dockerfile[\w.\-]*$/.test(f.path) && f.kind!=='ignored').slice(0,15);

  function wireNode(g,n){

  function fit(){

  return G;
}

/* layout helpers */
function layeredLayout(nodes, edges, colOf, opts={}){
  const W=opts.w||214, H=opts.h||58, GX=opts.gx||120, GY=opts.gy||16;
  const cols = [...new Set(nodes.map(colOf))].sort((a,b)=>a-b);
  const idx = new Map(cols.map((c,i)=>[c,i]));
  const lists = cols.map(c=>nodes.filter(n=>colOf(n)===c).sort((a,b)=>(b.weight||0)-(a.weight||0)));
  const pos = new Map(); const setPos=()=>lists.forEach(l=>l.forEach((n,i)=>pos.set(n.id,i)));
  setPos();
  for (let pass=0; pass<4; pass++) {
    const order = pass%2? [...lists].reverse() : lists;
    for (const l of order) { const bc = n => { const nb=[]; edges.forEach(e=>{ if(e.s===n.id&&pos.has(e.t))nb.push(pos.get(e.t)); if(e.t===n.id&&pos.has(e.s))nb.push(pos.get(e.s)); }); return nb.length? nb.reduce((a,b)=>a+b,0)/nb.length : pos.get(n.id); };
      const b = new Map(l.map(n=>[n.id,bc(n)])); l.sort((a,c)=>b.get(a.id)-b.get(c.id)); l.forEach((n,i)=>pos.set(n.id,i)); }
  }
  const top = 60, MAXR = opts.maxRows||9; let maxH = 0; const headers=[], lanes=[];
  let xCursor = 40; const spans=[];
  lists.forEach(l=>{ const subs=Math.max(1,Math.ceil(l.length/MAXR)); const rows=Math.ceil(l.length/subs); l.forEach((n,i)=>{ const sc=Math.floor(i/rows), r=i%rows; n.x=xCursor+sc*(W+40); n.y=top+r*(H+GY); n.w=W; n.h=H; }); maxH=Math.max(maxH,rows*(H+GY)); const width=subs*W+(subs-1)*40; spans.push({x:xCursor,w:width}); xCursor+=width+GX; });
  spans.forEach((sp,ci)=>{ headers.push({x:sp.x,y:top-24,text:(opts.titles||COL_TITLES)[cols[ci]]||''}); lanes.push({x:sp.x-12,y:top-12,w:sp.w+24,h:maxH+8}); });
  return {headers, lanes};
}
function forceLayout(nodes, edges, W=900, H=600){
  const n = nodes.length; if(!n) return;
  nodes.forEach((p,i)=>{ const a=i/n*Math.PI*2; p.x=W/2+Math.cos(a)*W*0.35; p.y=H/2+Math.sin(a)*H*0.35; p.vx=0; p.vy=0; });
  const idx = new Map(nodes.map((p,i)=>[p.id,i]));
  const links = edges.map(e=>[idx.get(e.s),idx.get(e.t)]).filter(l=>l[0]!=null&&l[1]!=null);
  const k = Math.sqrt(W*H/Math.max(n,1))*0.85;
  for (let it=0; it<320; it++) {
    const t = 1 - it/320;
    for (let i=0;i<n;i++) for (let j=i+1;j<n;j++) { const a=nodes[i], b=nodes[j]; let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy||.01, d=Math.sqrt(d2); const minD=a.r+b.r+26+(a.grp!=null&&a.grp!==b.grp?44:0); const f=(k*k/d2)*0.9 + (d<minD?(minD-d)*0.2:0); const fx=dx/d*f, fy=dy/d*f; a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy; }
    for (const [i,j] of links) { const a=nodes[i], b=nodes[j]; const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||.01; const f=(d-k*0.9)*0.035; const fx=dx/d*f, fy=dy/d*f; a.vx+=fx; a.vy+=fy; b.vx-=fx; b.vy-=fy; }
    if (nodes.some(p=>p.grp!=null)) { const cen=new Map(); for (const p of nodes) { if(p.grp==null)continue; let c=cen.get(p.grp); if(!c){c={x:0,y:0,n:0};cen.set(p.grp,c);} c.x+=p.x; c.y+=p.y; c.n++; } const gs=[...cen.entries()].map(([id,c])=>({id,x:c.x/c.n,y:c.y/c.n,r:34+16*Math.sqrt(c.n),px:0,py:0})); for (let i=0;i<gs.length;i++) for (let j=i+1;j<gs.length;j++) { const a=gs[i],b=gs[j]; let dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy)||.1; const need=a.r+b.r; if(d<need){ const f=(need-d)*0.35; a.px+=dx/d*f; a.py+=dy/d*f; b.px-=dx/d*f; b.py-=dy/d*f; } } const gm=new Map(gs.map(g=>[g.id,g])); for (const p of nodes) { const c=p.grp!=null&&cen.get(p.grp); if(c){ const g=gm.get(p.grp); p.vx+=(c.x/c.n-p.x)*0.07+g.px; p.vy+=(c.y/c.n-p.y)*0.07+g.py; } } }
    for (const p of nodes) { p.vx+=(W/2-p.x)*0.004; p.vy+=(H/2-p.y)*0.004; const sp=Math.hypot(p.vx,p.vy)||1, cap=40*t+2; if(sp>cap){p.vx*=cap/sp;p.vy*=cap/sp;} p.x+=p.vx; p.y+=p.vy; p.vx*=0.5; p.vy*=0.5; }
  }
}

/* ---------------- view builders ---------------- */
function archNodesEdges(){
  const nodes=[], edges=[];
  A.comps.forEach(c=>{
    const langs = Object.entries(c.langs).sort((a,b)=>b[1]-a[1])[0];
    nodes.push({id:'c'+c.id, kind:'comp', label:c.label, sub:`${c.files.length} files${langs?' · '+langs[0]:''}${c.endpoints?' · '+c.endpoints+' routes':''}`, color:COMP_COLOR(c), role:c.role, cid:c.id,
      badges:[c.entries.length?'⚡':'', c.cycle?'↻':''].filter(Boolean), weight:c.files.length, r:11+Math.min(24,Math.sqrt(c.files.length)*2.4), title:`${c.label}\n${describeComp(c)}`});
  });
  D.edges.forEach(e=>edges.push({s:'c'+e.s,t:'c'+e.t,w:e.w,back:e.back,raw:e,title:`${A.comps[e.s].label} → ${A.comps[e.t].label}\n${e.w} import${e.w>1?'s':''}${e.back?'\n⚠ goes against the usual layer direction':''}`}));
  if (UI.showExt) {
    A.services.forEach((s,i)=>{ nodes.push({id:'x'+i, kind:'svc', cat:s.cat, label:s.label, sub:s.cat+(s.inferred?' · inferred':''), icon:CAT_ICON[s.cat], color:'var(--ext)', sidx:i, weight:s.links.length, r:15, title:`${s.label} (${s.cat})\ndetected via ${s.sources.join(', ')}`}); });
    D.svcEdges.forEach(e=>edges.push({s:'c'+e.s,t:e.t,w:e.w,inferred:e.inferred,title:`${A.comps[e.s].label} → ${A.services[+e.t.slice(1)].label}${e.inferred?' (inferred)':''}`}));
  }
  return {nodes,edges};
}

let GRAPH=null;
function drawArch(){
  const {nodes,edges}=archNodesEdges();
  if (UI.layout==='layered') {
    const colOf = n => n.kind==='svc'?4:D.col(A.comps[n.cid]);
    const L = layeredLayout(nodes,edges,colOf);
    GRAPH.set(nodes,edges,'layered',L);
  } else {
    forceLayout(nodes,edges,1000,700); GRAPH.set(nodes,edges,'force');
  }
  GRAPH.select(UI.sel); requestAnimationFrame(()=>GRAPH.fit());
}
function drawDrill(cid){
  const c = A.comps[cid]; const inComp = new Set(c.files);
  const deg = id => A.files[id].imports.length + A.files[id].importedBy.length;
  const fl = c.files.map(id=>A.files[id]).sort((a,b)=>deg(b.id)-deg(a.id)||b.size-a.size).slice(0,90);
  const keep = new Set(fl.map(f=>f.id)); const nodes=[], edges=[], ghosts=new Map();
  fl.forEach(f=>nodes.push({id:'f'+f.id,kind:'file',label:base(f.path),sub:f.routes.length?f.routes.length+' routes':'',color:COMP_COLOR(c),r:7+Math.min(14,Math.sqrt(f.size/200)),title:f.path,fid:f.id}));
  const seen=new Set();
  for (const [a,b] of A.fileEdges) { const fa=A.files[a], fb=A.files[b];
    const ina=keep.has(a), inb=keep.has(b);
    if (ina&&inb) { const k=a+'>'+b; if(!seen.has(k)){seen.add(k);edges.push({s:'f'+a,t:'f'+b,w:1});} }
    else if (ina && fb.comp>=0 && fb.comp!==cid) { ghosts.set(fb.comp,1); const k=a+'>g'+fb.comp; if(!seen.has(k)){seen.add(k);edges.push({s:'f'+a,t:'g'+fb.comp,w:1});} }
    else if (inb && fa.comp>=0 && fa.comp!==cid) { ghosts.set(fa.comp,1); const k='g'+fa.comp+'>'+b; if(!seen.has(k)){seen.add(k);edges.push({s:'g'+fa.comp,t:'f'+b,w:1});} } }
  for (const g of ghosts.keys()) nodes.push({id:'g'+g,kind:'ghost',label:A.comps[g].label,sub:'other component',color:COMP_COLOR(A.comps[g]),r:18,cid:g,title:A.comps[g].label});
  forceLayout(nodes,edges,900,650); GRAPH.set(nodes,edges,'force'); requestAnimationFrame(()=>GRAPH.fit());
}

/* ---------------- methods ---------------- */
const hasCalls = cid => { for (const k of D.mOut.keys()) if (+k.split('.')[0]===cid) return true; for (const k of D.mIn.keys()) if (+k.split('.')[0]===cid) return true; return false; };

const mname = (c,m) => A.classes[c].fn ? `${A.classes[c].name}::${A.classes[c].methods[m]}` : `${A.classes[c].name}.${A.classes[c].methods[m]}`;

  } else {

/* flows */
function computePaths(){
  const cs=A.comps; const starts = cs.filter(c=>c.entries.length).sort((a,b)=>b.fanOut-a.fanOut);
  let st = starts.length? starts : cs.filter(c=>c.fanIn===0&&c.fanOut>0).sort((a,b)=>b.fanOut-a.fanOut);
  st = st.slice(0,6);
  const svcBy = cs.map(()=>[]); A.services.forEach((s,i)=>s.links.forEach(l=>svcBy[l[0]].push({s,i})));
  const res=[];
  for (const start of st) {
    const paths=[]; const dfs=(cur,path,seen)=>{
      if (paths.length>600) return;
      const outs = D.out[cur].slice().sort((a,b)=>b.w-a.w).filter(e=>!seen.has(e.t));
      if (!outs.length || path.length>=7) { paths.push(path.slice()); return; }
      for (const e of outs.slice(0,6)) { seen.add(e.t); path.push({id:e.t,edge:e}); dfs(e.t,path,seen); path.pop(); seen.delete(e.t); }
    };
    dfs(start.id,[{id:start.id}],new Set([start.id]));
    const scored = paths.map(p=>{ const last=p[p.length-1].id; const sv=svcBy[last][0]; return {p, sv, score:p.length*2+(sv?3:0)+p.reduce((a,x)=>a+(x.edge?Math.log2(1+x.edge.w):0),0)*0.3}; }).sort((a,b)=>b.score-a.score);
    const chosen=[]; for (const x of scored) { if (chosen.length>=3) break; if (x.p.length<2 && chosen.length) continue; if (chosen.some(c=>c.p.slice(0,2).map(y=>y.id).join()===x.p.slice(0,2).map(y=>y.id).join() && c.p[c.p.length-1].id===x.p[x.p.length-1].id)) continue; chosen.push(x); }
    res.push({start, paths:chosen});
  }
  return res;
}

/* files */
function buildTree(){
  const root={name:'',children:new Map(),files:0,path:''};
  for (const f of A.files) { if (f.kind==='ignored') continue; let n=root; n.files++; const parts=f.path.split('/'); parts.forEach((p,i)=>{ if(i===parts.length-1) { n.children.set(p,{name:p,file:f,path:f.path}); } else { let c=n.children.get(p); if(!c){c={name:p,children:new Map(),files:0,path:parts.slice(0,i+1).join('/')};n.children.set(p,c);} c.files++; n=c; } }); }
  return root;
}

/* export */
const mid_ = s => 'n'+s;
function mermaid(){
  const q = s => String(s).replace(/"/g,"'");
  const lines=['flowchart LR']; const byCol={};
  A.comps.forEach(c=>{ (byCol[D.col(c)]=byCol[D.col(c)]||[]).push(c); });
  Object.keys(byCol).sort().forEach(k=>{ lines.push(`  subgraph L${k}["${COL_TITLES[k]}"]`); byCol[k].forEach(c=>lines.push(`    c${c.id}["${q(c.label)}<br/><small>${c.files.length} files</small>"]`)); lines.push('  end'); });
  if (A.services.length) { lines.push('  subgraph EXT["External systems"]'); A.services.forEach((s,i)=>lines.push(`    x${i}[("${q(s.label)}")]`)); lines.push('  end'); }
  D.edges.forEach(e=>lines.push(`  c${e.s} ${e.back?'-.->':'-->'}|${e.w}| c${e.t}`));
  A.services.forEach((s,i)=>s.links.forEach(l=>lines.push(`  c${l[0]} -.-> x${i}`)));
  return lines.join('\n');
}
function classMermaid(){
  const ce=(A.classEdges||[]).filter(e=>e[2]>0); if(!ce.length) return '';
  const d=classDeg(); const pick=ce.slice().sort((a,b)=>(d.get(b[0])||0)+(d.get(b[1])||0)-(d.get(a[0])||0)-(d.get(a[1])||0)).slice(0,90);
  const id=k=>k.name.replace(/\W/g,'_'); const lines=['classDiagram']; const seen=new Set();
  pick.forEach(([a,b,t])=>{ const A_=A.classes[a],B_=A.classes[b]; const l=`  ${id(B_)} <|${t===2?'..':'--'} ${id(A_)}`; if(!seen.has(l)){seen.add(l);lines.push(l);} });
  return lines.join('\n');
}
function callMermaid(){
  const cs=(A.calls||[]).filter(c=>c[0]!==c[2]); if(!cs.length) return '';
  const deg=new Map(); cs.forEach(([a,b,c,d])=>{ [a+'.'+b,c+'.'+d].forEach(k=>deg.set(k,(deg.get(k)||0)+1)); });
  const pick=cs.slice().sort((x,y)=>(deg.get(y[0]+'.'+y[1])+deg.get(y[2]+'.'+y[3]))-(deg.get(x[0]+'.'+x[1])+deg.get(x[2]+'.'+x[3]))).slice(0,70);
  const nodes=new Map(); const lines=['flowchart LR'];
  const nd=(c,m)=>{ const id='m'+c+'_'+m; if(!nodes.has(id)){ nodes.set(id,1); lines.push(`  ${id}["${mname(c,m).replace(/"/g,"'")}"]`); } return id; };
  pick.forEach(([a,b,c,d])=>lines.push(`  ${nd(a,b)} --> ${nd(c,d)}`));
  return lines.join('\n');
}
function markdownReport(){
  const r=A.repo, s=A.stats; const L=[];
  L.push(`# ${r.owner}/${r.name} — architecture`,'',`_Generated by Repo Atlas from ${r.url} @ ${r.branch}_`,'',narrative().replace(/<[^>]+>/g,''),'','## Components','','| Component | Layer | Files | Depends on | Used by |','|---|---|---|---|---|');
  A.comps.forEach(c=>L.push(`| \`${c.label}\` | ${ROLE_LABEL[c.role]} | ${c.files.length} | ${D.out[c.id].map(e=>A.comps[e.t].label).join(', ')||'—'} | ${D.inc[c.id].map(e=>A.comps[e.s].label).join(', ')||'—'} |`));
  if (A.services.length) { L.push('','## External systems',''); A.services.forEach(x=>L.push(`- **${x.label}** (${x.cat}) — used by ${x.links.map(l=>A.comps[l[0]].label).join(', ')}${x.inferred?' _(inferred)_':''}`)); }
  if (A.entries.length) { L.push('','## Entry points',''); A.entries.slice(0,15).forEach(e=>L.push(`- \`${e.path}\` (${e.kind})`)); }
  const rt=A.routes.filter(x=>x.method!=='PAGE'); if (rt.length) { L.push('','## HTTP endpoints',''); rt.slice(0,60).forEach(x=>L.push(`- \`${x.method} ${x.path}\` — ${x.file}`)); }
  if (A.compose.services.length) { L.push('','## Docker Compose services',''); A.compose.services.forEach(x=>L.push(`- **${x.name}** — ${x.image||'build '+x.build}${x.dependsOn.length?' (depends on '+x.dependsOn.join(', ')+')':''}`)); }
  L.push('','## Findings',''); insights().forEach(([,h])=>L.push('- '+h.replace(/<[^>]+>/g,'')));
  L.push('','```mermaid',mermaid(),'```');
  return L.join('\n');
}
